<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dublje — Boj na Dublju 1815</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0714;--bg2:#140c27;--ink:#efeaff;--dim:#a99dd3;--amber:#ffb25a;--pink:#ff3d81;--cyan:#22e6ff;--line:#32235f;
  --display:"Russo One","Arial Black",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--mono);overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
h2{font:400 clamp(1.8rem,5vw,3rem)/1.05 var(--display);margin:0 0 10px}
.lede{color:var(--dim);max-width:60ch;margin:0 0 30px}
button{font-family:var(--mono)}

.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:var(--bg2)}
#hi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;filter:saturate(1.35) contrast(1.12) brightness(.85);transform:scale(1.04)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,7,20,.75) 0%,rgba(60,15,80,.25) 40%,rgba(10,7,20,.92) 100%),radial-gradient(circle at 20% 15%,rgba(255,178,90,.35),transparent 45%)}
.sweep{position:absolute;left:0;right:0;top:0;height:3px;z-index:3;background:var(--cyan);box-shadow:0 0 24px 6px var(--cyan);animation:sw 2.4s ease-in 1 forwards;opacity:0}
@keyframes sw{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
.top,.bot{position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:24px;font-size:13px}
.top .r{display:flex;gap:12px;align-items:center}
#clk{color:var(--cyan);font-weight:600}
.lang{display:flex;border:1px solid var(--amber)}
.lang button{font:600 13px var(--mono);color:var(--amber);background:rgba(10,7,20,.6);border:0;padding:0 12px;min-height:44px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--bg)}
.bot{padding-bottom:44px}
h1{font:400 clamp(3.6rem,19vw,12rem)/.9 var(--display);margin:0;text-shadow:0 0 28px rgba(255,61,129,.6),0 0 70px rgba(255,178,90,.35)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;opacity:0;pointer-events:none}
.glitch::before{color:var(--cyan);transform:translate(-4px,0)}
.glitch::after{color:var(--pink);transform:translate(4px,0)}
.glitch.go::before,.glitch.go::after{animation:gl .9s steps(1) 1}
@keyframes gl{0%{opacity:1;clip-path:inset(10% 0 70% 0)}20%{opacity:1;clip-path:inset(60% 0 10% 0)}40%{opacity:1;clip-path:inset(30% 0 40% 0)}60%{opacity:1;clip-path:inset(80% 0 2% 0)}80%{opacity:1;clip-path:inset(0 0 85% 0)}100%{opacity:0}}
.sub{max-width:36ch;font-size:clamp(1rem,2.6vw,1.3rem);margin:18px 0 0;text-shadow:0 2px 14px var(--bg)}
.sub b{color:var(--amber);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;font-size:13px}
.tags span{border:1px solid var(--cyan);color:var(--cyan);padding:4px 10px;background:rgba(10,7,20,.55)}
.cta{display:inline-flex;align-items:center;margin-top:22px;padding:0 20px;min-height:48px;background:var(--pink);color:#fff;font-weight:600;text-decoration:none;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cta:hover{background:var(--cyan);color:var(--bg)}

/* BATTLE */
.battle{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
#bf{width:100%;height:auto;display:block;border:1px solid var(--line);background:#0f2a1f}
.u{transition:transform 1.8s cubic-bezier(.5,0,.3,1),opacity .8s}
.o{fill:var(--pink)}.s{fill:var(--cyan)}
.lw{font:600 13px var(--mono);fill:#d9d3f5;transition:opacity .6s}
.lz{font:600 6px var(--mono);fill:#d9d3f5;transition:opacity .6s}
.fire{fill:#ff7a1a;animation:fl .45s infinite alternate;transition:opacity .8s}
@keyframes fl{to{opacity:.45}}
.fade{transition:opacity .8s}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 6px 0 0;vertical-align:baseline}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim);margin:10px 0 0}
.ctl{display:flex;gap:8px;align-items:center;margin:14px 0;flex-wrap:wrap}
.ctl button{min-width:44px;min-height:44px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);cursor:pointer;font-size:16px}
.ctl button:hover{border-color:var(--amber)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{min-width:38px;font-size:13px}
.steps button[aria-current="true"]{background:var(--amber);color:var(--bg);border-color:var(--amber);font-weight:600}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--amber)}
@keyframes fill{to{width:100%}}
.sp{border:1px solid var(--line);border-top:0;background:var(--bg2);padding:22px 24px;min-height:200px}
.sp .k{color:var(--pink);font-size:13px;margin-bottom:6px}
.sp h3{font:400 1.7rem/1.1 var(--display);margin:0 0 10px}
.sp p{margin:0;max-width:68ch}
.info{margin-top:44px}

/* SCANNER */
.scan{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
.fig{position:relative;border:1px solid var(--line);aspect-ratio:345/275;background:var(--bg2)}
.fig img{width:100%;height:100%;display:block;object-fit:cover}
.hs{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--cyan);background:rgba(34,230,255,.12);cursor:pointer;padding:0}
.hs::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--cyan)}
.hs[aria-pressed="true"]{border-color:var(--pink);background:rgba(255,61,129,.2)}
.hs[aria-pressed="true"]::after{background:var(--pink)}
.panel{border:1px solid var(--line);background:var(--bg2);padding:22px 24px;min-height:210px}
.panel h3{font:400 1.6rem/1.1 var(--display);margin:0 0 8px}
.panel .k{color:var(--pink);font-size:13px;margin-bottom:6px}
.panel p{margin:0}

/* POP */
.pop{background:linear-gradient(180deg,var(--bg),var(--bg2));border-block:1px solid var(--line)}
.big{font:400 clamp(3.5rem,14vw,8rem)/1 var(--display);color:var(--amber);text-shadow:0 0 30px rgba(255,178,90,.4)}
.yr{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 24px;margin-bottom:6px}
.delta{color:var(--pink);font-weight:600}
input[type=range]{width:100%;max-width:560px;accent-color:var(--amber);height:44px;margin:12px 0 4px;cursor:pointer}
.ticks{display:flex;justify-content:space-between;max-width:560px;color:var(--dim);font-size:13px}
#dots{display:grid;grid-template-columns:repeat(auto-fill,12px);gap:4px;margin:30px 0 8px;max-width:760px}
#dots i{width:12px;height:12px;border-radius:50%;background:var(--amber);transition:background .35s}
#dots i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.note{color:var(--dim);font-size:13px;margin:0}
.ages{display:flex;height:46px;margin:46px 0 10px;max-width:760px;gap:3px}
.ages div{display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;color:var(--bg);white-space:nowrap;overflow:hidden}

.home{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.home figure{margin:0}
.home img{width:100%;display:block;border:1px solid var(--line);filter:saturate(1.25) contrast(1.08)}
.home figcaption{font-size:13px;color:var(--dim);margin-top:8px}
.where{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.map{width:100%;border:1px solid var(--line);background:var(--bg2)}
dl{margin:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
dt{color:var(--pink);font-weight:600}
dd{margin:0}
footer{padding:36px 0 56px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
.tri{display:flex;height:6px;margin-bottom:16px;max-width:240px}
.tri i{flex:1}

@media (max-width:780px){
  .scan,.home,.where{grid-template-columns:1fr}
  section{padding:56px 0}
  .row{grid-template-columns:1fr;gap:2px}
  #clk{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <img id="hi" alt="" src="">
  <div class="sweep" aria-hidden="true"></div>
  <div class="wrap top">
    <span>SIGNAL // 44.80°N 19.51°E</span>
    <div class="r"><span id="clk" title="Local time">--:--:--</span>
      <div class="lang" role="group" aria-label="Language / Језик">
        <button data-l="en" aria-pressed="true">EN</button><button data-l="cy" aria-pressed="false">СР</button><button data-l="la" aria-pressed="false">SR</button>

  <div class="wrap bot">

  </div>
</section>

    <h2 data-t="sh"></h2>

const INFO=[
[["Date","Датум"],["26 July 1815 (14 July O.S.), after a night skirmish on 25 July. The last battle of the Second Serbian Uprising.","26. јул 1815. (14. јул по старом), после ноћног окршаја 25. јула. Последњи бој Другог српског устанка."]],
[["Serbs","Срби"],["Prince Miloš Obrenović with Rudnik, Valjevo, Kragujevac and Mačva fighters. Commanders: Moler, Jovan Obrenović, Milić Drinčić, Sima Nenadović, Nikola Smiljanić, Sima Katić.","Кнез Милош Обреновић са борцима из Рудника, Ваљева, Крагујевца и Мачве. Старешине: Молер, Јован Обреновић, Милић Дринчић, Сима Ненадовић, Никола Смиљанић, Сима Катић."]],
[["Ottomans","Турци"],["Ibrahim Ali Pasha of Nikšić with about 1,300 men (around 1,000 Bosnian and 300 from Nikšić), the vanguard of Hurshid Pasha's Bosnian army.","Ибрахим-паша Никшићки са око 1.300 људи (око 1.000 Босанаца и 300 Никшићана), претходница Хуршид-пашине босанске војске."]],
[["Losses","Губици"],["Ottomans: over 1,000 dead and 80–83 captured. Serbs: light, but two famed voivodes fell. One local account counts 50 Serbian dead.","Турци: преко 1.000 мртвих и 80–83 заробљена. Срби: лаки, али су пале две чувене војводе. Једно локално предање говори о 50 погинулих Срба."]],
[["Legend","Легенда"],["Mačva lore says the fight was sparked when the daughter of Hasan-beg Drvenica ran off with a Serb and hajduks clashed with Ottoman troops. Treat it as local legend.","По мачванском предању, бој је избио када је ћерка Хасан-бега Дрвенице побегла са Србином, па су се хајдуци сукобили са турском војском. Узмите то као локалну легенду."]],
[["Remembered","Памћење"],["A monument to the battle stands in the village, the church was founded on the 120th anniversary, the 200th was marked in 2015, and the Boj na Dublju festival is held every year in Bogatić.","Споменик боју стоји у селу, црква је подигнута на 120. годишњицу, 200 година обележено је 2015, а манифестација „Бој на Дубљу“ сваке године се одржава у Богатићу."]]

[["Coordinates","Координате"],["44°48′N 19°30′E","44°48′ С 19°30′ И"]],
[["Neighbours","Суседи"],["Belotić to the north-east, the town of Bogatić close by, and Šabac about 25 km east of Bogatić.","Белотић на североистоку, град Богатић у близини, а Шабац око 25 km источно од Богатића."]],
[["Rivers","Реке"],["The Bogatić area lies between the Sava and the Drina.","Подручје Богатића налази се између Саве и Дрине."]]

const H=[
[55,75,["Main street","Главна улица"],["One long road cuts the village on a diagonal, with green verges and houses set back behind them.","Један дуг пут пресеца село дијагонално, са зеленим ивицама и кућама увученим иза њих."]],
[26,58,["Red roofs","Црвени кровови"],["Pitched roofs in terracotta and brick red, with long houses sitting in deep yards.","Стрми кровови боје цигле и теракоте, са дугим кућама у дубоким двориштима."]],
[38,42,["Tree belt","Појас дрвећа"],["A dense band of tall trees sits between the houses and the open fields.","Густ појас високог дрвећа налази се између кућа и отворених поља."]],
[23,30,["The flat horizon","Равни хоризонт"],["Beyond the last roofs the plain runs flat to the sky. Mačva is fertile farmland.","Иза последњих кровова равница се пружа до неба. Мачва је плодан ратарски крај."]],
[7,13,["Dusk","Сумрак"],["Shot as the sun slips under a layer of cloud, when the whole village goes amber for a few minutes.","Снимљено док сунце залази испод слоја облака, када цело село накратко добије боју ћилибара."]]

/* battle stages: [title, date, text] */
const ST=[
[["Bosnian army crosses the Drina","Босанска војска прелази Дрину"],["July 1815","Јул 1815."],["The Second Serbian Uprising began in April at Takovo. In Bosnia, Hurshid Pasha gathers a big army to crush it. His vanguard under Ibrahim Ali Pasha of Nikšić, about 1,300 men, crosses the Drina at Janj and reaches Lešnica. The rebels expect an attack over Cer toward Šabac, so most of their army waits south of Cer.","Други српски устанак букнуо је априла у Takovu. У Босни Хуршид-паша окупља велику војску да га угуши. Његова претходница под Ибрахим-пашом Никшићким, око 1.300 људи, прелази Дрину код Јања и стиже у Лешницу. Устаници очекују удар преко Цера ка Шапцу, па већина њихове војске чека јужно од Цера.".replace("Takovu","Такову")]],
[["A trench on the road to Šabac","Шанац на путу ка Шапцу"],["July 1815","Јул 1815."],["Ibrahim reaches Dublje, which sits on the main road from Bosnia to Šabac and Belgrade. He forces captured Mačva Serbs to dig a large moat with a palisaded parapet in priest Mašić's meadow, by the Kitog road. It is the only fortification of the uprising in Mačva.","Ибрахим стиже у Дубље, на главни пут од Босне ка Шапцу и Београду. Заробљене Мачване приморава да ископају велики шанац са палисадом на ливади попа Машића, поред Китошког пута. То је једино утврђење из Другог устанка у Мачви."]],
[["Miloš chooses Dublje","Милош бира Дубље"],["25 July 1815 (13 July O.S.)","25. јул 1815. (13. јул по старом)"],["Miloš Obrenović gathers fighters from Rudnik, Valjevo and Kragujevac and marches via Tamnava to Lipolist. He picks Dublje because it controls the Bosnia road and the rebels need another victory to show they are strong. Local men like Archpriest Nikola Smiljanić know the ground.","Милош Обреновић окупља борце из Рудника, Ваљева и Крагујевца и преко Тамнаве стиже у Липолист. Бира Дубље јер оно држи пут из Босне, а устаницима је потребна још једна победа. Терен познају мештани, међу њима прота Никола Смиљанић."]],
[["First strike in the rain","Први удар по киши"],["Evening, 25 July","Увече, 25. јула"],["Petar Nikolajević Moler and Jovan Obrenović ride out in heavy rain. Guided by Smiljanić and Sima Katić, they circle round and hit suddenly, driving the Ottomans into the moat and burning sheds. Gunfire lasts all night. Moler wanted a full assault at once, but Miloš delayed it a day.","Петар Николајевић Молер и Јован Обреновић крећу по пљуску. Са водичима Смиљанићем и Симом Катићем заобилазе и изненада нападају, потискују Турке у шанац и пале шупе. Паљба траје целу ноћ. Молер је тражио одлучан јуриш, али га је Милош одложио за дан."]],
[["Surrender refused","Предаја одбијена"],["Morning, 26 July (14 July O.S.)","Ујутру, 26. јула (14. јул по старом)"],["Miloš arrives with the main army, including Milić Drinčić and Sima Nenadović, and rings the fort. He offers the Ottomans a chance to surrender. They refuse. Miloš insists the battle be fought by daylight.","Милош стиже са главнином, међу којом су Милић Дринчић и Сима Ненадовић, и опкољава шанац. Нуди Турцима да се предају, они одбијају. Милош је захтевао да се бој води по дану."]],
[["The signal","Знак за јуриш"],["Midday, 26 July","У подне, 26. јула"],["Miloš plans a violent assault behind domuz-araba, big shield carts already used at Palež. At midday he rides round the moat with his standard-bearer Sima Paštrmac, briefs each unit, fires a few shots at the moat and signals a simultaneous attack from all sides.","Милош припрема јуриш иза домуз-араба, великих штитова на колима употребљених већ на Палежу. У подне са барјактаром Симом Паштрмцем обилази шанац, обавештава јединице, испаљује неколико метака и даје знак за истовремени напад са свих страна."]],
[["Shield carts advance","Штитови крећу напред"],["Midday, 26 July","У подне, 26. јула"],["The field fills with gunfire. The shield carts roll toward the moat, followed by waves of infantry. Irregular columns in the first line are pushed back but later lines reinforce them. Commanders run ahead so nobody leaves. Sima Nenadović rides before the moat and calls his men on for the Cross and the faith.","Поље се испуни паљбом. Штитови крећу ка шанцу, а за њима таласи пешадије. Нередовни стубови у првом реду су потиснути, али их појачавају наредни редови. Старешине трче испред да нико не одустане. Сима Ненадовић јаше пред шанцем и зове људе у јуриш за крст и веру."]],
[["Storming the parapet","Јуриш на бедем"],["Afternoon, 26 July","По подне, 26. јула"],["Teša Podrug, Petar Čarko, Boško Šarić and others climb the parapet and drop inside. Close fighting with yataghans spreads panic. The Ottomans rush the gate, where Milić Drinčić's men wait and cut them down. Drinčić is shot at the gate, most likely by friendly fire, and Sima Nenadović falls at the moat.","Теша Подруг, Петар Чарко, Бошко Шарић и други пењу се на бедем и скачу унутра. Сеча јатаганима изблиза шири панику. Турци јуре ка капији, где их чекају Дринчићеви људи и секу их. Дринчић је погођен на капији, највероватније својом ватром, а Сима Ненадовић пада код шанца."]],
[["Ibrahim Pasha captured","Заробљен Ибрахим-паша"],["26 July","26. јул"],["Survivors scatter into the shrubs, where fighting goes on briefly. Ibrahim Ali Pasha is found barefoot with a sabre, but surrenders at once to Teša Podrug, the Čaraković brothers and Ilija Koreniti. Of about 1,300 Ottomans only 80 to 83 are taken alive. His son Osman dies in the fight.","Преживели се разбегну по жбуњу, где се борба кратко наставља. Ибрахим-паша је нађен бос са сабљом, али се одмах предаје Теши Подругу, браћи Чараковићима и Илији Коренитом. Од око 1.300 Турака живо је заробљено 80 до 83. Паши погине син Осман."]],
[["A pasha sent home","Паша враћен кући"],["After 26 July","После 26. јула"],["Miloš treats Ibrahim with courtesy and returns his sabre and belongings. They talk at Crniljevo about why the uprising began, and Ibrahim advises dealing directly with the Sultan. He is released. Hurshid's help for Belgrade is stopped. Dublje is the last battle of the uprising, and peace with Marashli Ali Pasha at Ćuprija brings Serbia autonomy.","Милош љубазно прима Ибрахима и враћа му сабљу и ствари. У Црниљеву разговарају о узроцима устанка, а Ибрахим саветује да Милош преговара директно са султаном. Паша је пуштен. Хуршид-паши је спречено да помогне Београду. Дубље је последњи бој устанка, а мир са Марашли Али-пашом у Ћуприји доноси Србији аутономију."]]
];

/* ---------- battle scene ---------- */
const F=[520,240];
const J=Array.from({length:97},(_,i)=>{const a=Math.sin(i*12.9898)*43758.5453;return a-Math.floor(a)});
const jit=(i,k,s)=>(J[(i*7+k)%97]-.5)*s;
const IN=i=>[F[0]+jit(i,1,100),F[1]+jit(i,2,60)];
const R=(i,n,rx,ry)=>{const t=i/n*6.2832;return[F[0]+Math.cos(t)*rx+jit(i,5,6),F[1]+Math.sin(t)*ry+jit(i,6,6)]};
const NO=40,NS=60;
const OP=[
 i=>[90+(i%10)*7,235+Math.floor(i/10)*9],IN,IN,IN,IN,IN,IN,
 i=>i<20?[510+jit(i,3,40),270+jit(i,4,14),i%3?1:.15]:[...IN(i),i%2?1:.15],
 i=>i%12?[...IN(i),.1]:[452+jit(i,3,16),186+jit(i,4,12),1],
 i=>i%12?[...IN(i),.08]:[615+jit(i,3,14),268+jit(i,4,22),1]
];
const cer=i=>[650+jit(i,1,60),410+jit(i,2,40)],stg=i=>[700+jit(i,1,50),330+jit(i,2,60)];
const SP=[cer,cer,stg,
 i=>i<30?R(i,30,95,65):stg(i),
 i=>R(i,NS,100,68),i=>R(i,NS,100,68),i=>R(i,NS,78,52),
 i=>i%2?R(i,NS,62,46):IN(i),
 i=>i%3?IN(i):R(i,NS,56,40),
 i=>[625+jit(i,1,40),240+jit(i,2,60)]
];
const MP=[null,null,[690,330],[700,330],[640,240],"orbit",[610,235],[600,240],[600,240],[620,240]];
const IP=[null,null,null,null,null,null,null,null,[452,187],[620,266]];
const CP=[null,null,null,null,null,i=>R(i,8,92,62),i=>R(i,8,70,48),i=>R(i,8,64,44),null,null];
const WIDE=[0,0,800,480],ZOOM=[370,150,300,180];
const NS_="http://www.w3.org/2000/svg";
const mk=(p,cls)=>{const c=document.createElementNS(NS_,"circle");c.setAttribute("class","u "+cls);c.style.transform="translate(0px,0px)";$(p).appendChild(c);return c};
const OU=Array.from({length:NO},()=>mk("units","o")),SU=Array.from({length:NS},()=>mk("units","s"));
const CU=Array.from({length:8},()=>{const r=document.createElementNS(NS_,"rect");r.setAttribute("class","u");r.setAttribute("x",-6);r.setAttribute("y",-3.5);r.setAttribute("width",12);r.setAttribute("height",7);r.setAttribute("fill","#ffb25a");r.style.opacity=0;$("carts").appendChild(r);return r});
const tr=(e,x,y)=>{e.style.transform=`translate(${x}px,${y}px)`};
let k=0,vb=WIDE.slice(),zr,orb;

function zoomTo(t){
  const a=vb.slice(),t0=performance.now();cancelAnimationFrame(zr);
  const f=now=>{let p=Math.min(1,(now-t0)/1500);p=p*p*(3-2*p);
    vb=a.map((v,i)=>v+(t[i]-v)*p);$("bf").setAttribute("viewBox",vb.join(" "));
    const r=5.5-3.1*((800-vb[2])/500);OU.concat(SU).forEach(c=>c.setAttribute("r",r));
    document.querySelectorAll(".mk").forEach(c=>c.setAttribute("r",r*1.6));
    if(p<1)zr=requestAnimationFrame(f)};
  zr=requestAnimationFrame(f);
}
function scene(){
  const z=k>2;zoomTo(z?ZOOM:WIDE);
  $("lw").style.opacity=z?0:1;$("lzz").style.opacity=z?1:0;$("q").style.opacity=k<2?1:0;
  $("fort").style.opacity=k>=1?1:0;
  ["moat","para"].forEach(id=>{const e=$(id);e.style.transition="stroke-dashoffset 2.4s";e.style.strokeDashoffset=k>=1?0:1});
  $("aO").style.opacity=k<2?1:0;$("aS").style.opacity=k==2?1:0;
  $("fires").style.opacity=k==3?1:(k==4?.25:0);$("cr").style.opacity=k>=7?1:0;
  OU.forEach((c,i)=>{const [x,y,o=1]=OP[k](i);tr(c,x,y);c.style.opacity=o});
  SU.forEach((c,i)=>{const [x,y]=SP[k](i);tr(c,x,y)});
  CU.forEach((c,i)=>{const f=CP[k];if(f){const [x,y]=f(i);tr(c,x,y);c.style.opacity=1}else c.style.opacity=0});
  const m=$("mM"),mp=MP[k];cancelAnimationFrame(orb);m.style.opacity=mp?1:0;
  if(mp==="orbit"){m.style.transition="none";let a=0,l=performance.now();const o=now=>{a+=(now-l)/1000*1.1;l=now;tr(m,F[0]+Math.cos(a)*100,F[1]+Math.sin(a)*68);orb=requestAnimationFrame(o)};orb=requestAnimationFrame(o)}
  else if(mp){m.style.transition="";tr(m,mp[0],mp[1])}
  const ib=$("mI"),ip=IP[k];ib.style.opacity=ip?1:0;if(ip)tr(ib,ip[0],ip[1]);
}
function stageText(){
  const s=ST[k];$("sn").textContent=fx(T.step)+" "+(k+1)+" / "+ST.length;
  $("sh").textContent=fx(s[0]);$("sd").textContent=fx(s[1]);$("sx").textContent=fx(s[2]);
  [...$("steps").children].forEach((b,i)=>b.setAttribute("aria-current",i===k))
}
const DUR=12000;let playing=false,timer;
function go(n){k=Math.max(0,Math.min(ST.length-1,n));scene();stageText();if(playing)sched()}
function sched(){clearTimeout(timer);const b=$("pb");b.style.animation="none";void b.offsetWidth;b.style.animation="fill "+DUR+"ms linear forwards";
  timer=setTimeout(()=>{if(k<ST.length-1)go(k+1);else play(false)},DUR)}
function play(on){playing=on;clearTimeout(timer);$("pp").textContent=on?"❚❚":"▶";if(on){if(k>=ST.length-1){k=0;scene();stageText()}sched()}else $("pb").style.animation="none"}
ST.forEach((_,i)=>{const b=document.createElement("button");b.textContent=i+1;b.addEventListener("click",()=>go(i));$("steps").appendChild(b)});
$("pv").onclick=()=>go(k-1);$("nx").onclick=()=>go(k+1);$("pp").onclick=()=>play(!playing);
let started=false;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&!started){started=true;if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setTimeout(()=>play(true),600)}},{threshold:.4}).observe($("bf"));

/* ---------- other sections ---------- */
$("hi").src=$("aer").src;
const f2=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Belgrade",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const tick=()=>{$("clk").textContent=f2.format(new Date())};tick();setInterval(tick,1000);

let cur=0;
H.forEach((h,i)=>{const b=document.createElement("button");b.className="hs";b.style.left=h[0]+"%";b.style.top=h[1]+"%";b.addEventListener("click",()=>{cur=i;hs()});$("fig").appendChild(b)});
function hs(){
  [...document.querySelectorAll(".hs")].forEach((b,i)=>{b.setAttribute("aria-pressed",i===cur);b.setAttribute("aria-label",fx(H[i][2]))});
  const h=H[cur];$("pn").innerHTML='<div class="k">'+fx(T.tg)+" "+(cur+1)+" / "+H.length+'</div><h3>'+fx(h[2])+'</h3><p>'+fx(h[3])+'</p>';
}
const D=[[1991,3408],[2002,3317],[2011,2900],[2022,2424]],U=25,dots=$("dots");
for(let i=0;i<Math.round(D[0][1]/U);i++)dots.appendChild(document.createElement("i"));
function pop(){
  const [y,p]=D[+$("rng").value],loc=lang==="en"?"en-US":"sr-RS";
  $("num").textContent=p.toLocaleString(loc);$("yv").textContent=fx(T.cen)+" "+y;
  const d=p-D[0][1];$("dl").textContent=d===0?fx(T.base):(d<0?"−":"+")+Math.abs(d).toLocaleString(loc)+" "+fx(T.since)+" ("+Math.round(d/D[0][1]*100)+"%)";
  [...dots.children].forEach((e,i)=>e.classList.toggle("off",i>=Math.round(p/U)));
}
$("rng").addEventListener("input",pop);

function apply(first){
  const t=lang==="la"?"DUBLJE":"ДУБЉЕ",el=$("ttl");el.textContent=t;el.dataset.t=t;
  if(!first){el.classList.remove("go");void el.offsetWidth;el.classList.add("go")}
  document.documentElement.lang=lang==="en"?"en":lang==="cy"?"sr-Cyrl":"sr-Latn";
  document.title=t+" — Boj na Dublju 1815";
  document.querySelectorAll("[data-t]").forEach(e=>{if(e.id==="ttl")return;const v=fx(T[e.dataset.t]);e instanceof SVGElement?e.textContent=v:e.innerHTML=v});
  $("info").innerHTML=INFO.map(r=>"<div class='row'><dt>"+fx(r[0])+"</dt><dd>"+fx(r[1])+"</dd></div>").join("");
  $("wh").innerHTML=WH.map(r=>"<div class='row'><dt>"+fx(r[0])+"</dt><dd>"+fx(r[1])+"</dd></div>").join("");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("hi").alt=$("aer").alt=lang==="en"?"Aerial view of Dublje at dusk":fx(["","Поглед из ваздуха на Дубље у сумрак"]);
  stageText();hs();pop();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;apply(false)}));
apply(true);scene();
</script>
